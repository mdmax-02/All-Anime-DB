name: Fetch Anime Database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: write

concurrency:
  group: anime-database-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore fetch checkpoint
        uses: actions/cache/restore@v4
        with:
          path: checkpoint_anime.json
          key: anime-fetch-checkpoint-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            anime-fetch-checkpoint-${{ github.ref_name }}-

      - name: Fetch anime data
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: python fetch_anime_complete_mal.py

      - name: Save fetch checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: checkpoint_anime.json
          key: anime-fetch-checkpoint-${{ github.ref_name }}-${{ github.run_id }}

      - name: Commit generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f anime_all_complete.json ]; then
            git add anime_all_complete.json
          fi

          if [ -f checkpoint_anime.json ]; then
            git add checkpoint_anime.json
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update anime database"
          git push
