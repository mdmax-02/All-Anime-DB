name: Fetch Anime Database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: anime-database-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      - name: Every 3 days gate
        id: cadence
        shell: bash
        run: |
          DAY=$(( $(date -u +%s) / 86400 ))
          if (( DAY % 3 == 0 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not a scheduled 3-day build day."
          fi

      - name: Checkout repository
        if: github.event_name == 'workflow_dispatch' || steps.cadence.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        if: github.event_name == 'workflow_dispatch' || steps.cadence.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.cadence.outputs.run == 'true'
        run: python -m pip install -r requirements.txt


      - name: Restore resumable fetch cache
        if: github.event_name == 'workflow_dispatch' || steps.cadence.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            checkpoint_anime.json
            mal_season_cache.json
            anilist_lookup_cache.json
            mal_detail_cache.json
          key: anime-fetch-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            anime-fetch-v2-

      - name: Fetch anime data
        if: github.event_name == 'workflow_dispatch' || steps.cadence.outputs.run == 'true'
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
        run: python fetch_anime_complete_mal.py


      - name: Save resumable fetch cache
        if: always() && (github.event_name == 'workflow_dispatch' || steps.cadence.outputs.run == 'true')
        uses: actions/cache/save@v4
        with:
          path: |
            checkpoint_anime.json
            mal_season_cache.json
            anilist_lookup_cache.json
            mal_detail_cache.json
          key: anime-fetch-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit generated JSON
        if: github.event_name == 'workflow_dispatch' || steps.cadence.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f anime_all_complete.json ]; then
            git add anime_all_complete.json
          fi

          if [ -f checkpoint_anime.json ]; then
            git add checkpoint_anime.json
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update anime database"
          git push
